name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build (Next.js)
        run: npm run build
        env:
          # Build only needs to compile — no real secrets at CI time.
          DATABASE_URL: "file:./ci.db"

  audit:
    name: dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm audit` is the lowest-friction dep scanner we can wire today.
      # `--omit=dev` keeps the surface tight: a dev-only CVE in prettier
      # shouldn't fail prod CI. Tighten to `moderate` once we've cleared
      # the high/critical baseline.
      - name: npm audit (production deps, high+)
        run: npm audit --audit-level=high --omit=dev
