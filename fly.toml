# fly.toml — TypeBeatOS production config
#
# Generated by hand (not `fly launch`) so the choices are auditable.
# Run `fly launch --no-deploy --copy-config` once the Fly app exists to
# wire up the GitHub Actions deploy token.

app = "typebeatos"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # APP_URL gets set as a secret post-launch (depends on Fly's assigned
  # *.fly.dev hostname before we attach a custom domain).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Single machine to start; the in-process render queue assumes one
  # worker. Scale to 2+ only after we move renders to a Fly worker
  # machine group with shared state (Sprint 3 cleanup).
  min_machines_running = 1
  processes = ["app"]

  # /api/ready, not /api/health: this loop runs every 30s forever, and a probe
  # that queries Postgres keeps Neon's scale-to-zero timer permanently reset
  # (see "Probes must stay DB-free" in docs/azure-deployment.md).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/ready"
    protocol = "http"

[[vm]]
  # ffmpeg-static + Node + Prisma on a single CPU is a tight fit. Bump to
  # shared-cpu-2x / 2gb the first time we see render queueing slow under
  # real load.
  size = "shared-cpu-1x"
  memory = "1gb"

[[mounts]]
  # Beats, rendered videos, and thumbnails. Survives machine restarts.
  source = "typebeatos_data"
  destination = "/app/uploads"
  initial_size = "10gb"
