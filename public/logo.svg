<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" aria-hidden="true">
  <!--
    TypeBeatOS monogram — stencil TB.
    A recreation of the supplied brand mark; the outer path forms the
    interlocking T+B silhouette and the inner path produces the
    double-outline / parallel-stroke detail.
    Use currentColor so it inherits the surrounding text colour (white
    on the dark glass nav, red on accent surfaces).
  -->
  <g stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="2" fill="none">
    <!-- Outer outline: T on top, B sitting underneath -->
    <path
      stroke-width="9"
      d="M28 30 H172 V64 H125 V104 H146 Q186 104 186 138 Q186 172 146 172 H125 V210 H85 V64 H28 Z M125 130 V146 H146 Q156 146 156 138 Q156 130 146 130 Z"
    />
    <!-- Inner offset outline: parallel double-line, classic stencil feel -->
    <path
      stroke-width="3.5"
      opacity="0.7"
      d="M44 46 H156 V52 H115 V114 H146 Q176 114 176 138 Q176 162 146 162 H115 V196 H95 V52 H44 Z"
    />
  </g>
</svg>
